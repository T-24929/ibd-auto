<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#f8f9fa" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#09090b" />
    <meta name="color-scheme" content="light dark" />

    <!-- Primary SEO Metadata -->
    <title>IBD Auto LK | Certified Pre-Owned Vehicles & Test Drive Scheduling</title>
    <meta
      name="description"
      content="Sri Lanka's trusted destination for verified pre-owned vehicles. Explore DMT-inspected cars, hoist verification, transparent pricing, and instant test drive appointments."
    />
    <meta
      name="keywords"
      content="cars for sale sri lanka, buy used cars colombo, certified pre owned vehicles, hybrid cars sri lanka, test drive booking, vehicle inspection sri lanka, ibd auto lk"
    />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://ibdauto.lk/" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ibdauto.lk/" />
    <meta property="og:site_name" content="IBD Auto LK" />
    <meta
      property="og:title"
      content="IBD Auto LK | Certified Pre-Owned Vehicles & Test Drive Scheduling"
    />
    <meta
      property="og:description"
      content="Sri Lanka's trusted destination for verified pre-owned vehicles. Explore DMT-inspected cars, hoist verification, transparent pricing, and instant test drive appointments."
    />
    <meta property="og:image" content="https://ibdauto.lk/white-logo.svg" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Cards -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://ibdauto.lk/" />
    <meta
      name="twitter:title"
      content="IBD Auto LK | Certified Pre-Owned Vehicles & Test Drive Scheduling"
    />
    <meta
      name="twitter:description"
      content="Sri Lanka's trusted destination for verified pre-owned vehicles. Explore DMT-inspected cars, hoist verification, transparent pricing, and instant test drive appointments."
    />
    <meta name="twitter:image" content="https://ibdauto.lk/white-logo.svg" />

    <!-- Schema.org Structured Data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "AutoDealer",
        "name": "IBD Auto LK",
        "url": "https://ibdauto.lk",
        "logo": "https://ibdauto.lk/white-logo.svg",
        "description": "Certified pre-owned vehicle dealership in Sri Lanka offering DMT-verified stock and test drive scheduling.",
        "telephone": "+94 77 123 4567",
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Colombo",
          "addressCountry": "LK"
        },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Friday",
              "Saturday"
            ],
            "opens": "08:30",
            "closes": "18:30"
          }
        ]
      }
    </script>

    <!-- Montserrat Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300..900;1,300..900&display=swap"
      rel="stylesheet"
    />

    <!-- Theme Initialization Script -->
    <script>
      (function () {
        try {
          const theme = localStorage.getItem('theme');
          const root = document.documentElement;

          if (theme === 'dark') {
            root.classList.add('dark', 'theme-dark');
            root.classList.remove('theme-light');
          } else {
            root.classList.remove('dark', 'theme-dark');
            root.classList.add('theme-light');
          }
        } catch {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
